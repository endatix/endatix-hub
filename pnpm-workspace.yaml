# Single source of pnpm configuration for Endatix Hub. pnpm 11+ ignores
# package.json#pnpm and reads only auth/registry keys from .npmrc, so every setting
# lives here; pnpm 10.34.5+ reads this file too, which keeps self-hosters on the
# same config. Supported range: see engines.pnpm in package.json.

# Never set sharedWorkspaceLockfile: this file makes the Hub a workspace root, and
# per-project lockfiles plus nodeLinker: hoisted fail every pnpm 10 install with
# ERR_PNPM_MISSING_HOISTED_LOCATIONS. The shared-lockfile default is correct for a
# single-package repo.
nodeLinker: hoisted

# Supply-chain defaults. pnpm 11+ ships these; pnpm 10 defaults are laxer
# (minimumReleaseAge 0, blockExoticSubdeps false), so set them explicitly and both
# majors behave identically. For a genuine same-day CVE patch add the package to
# minimumReleaseAgeExclude rather than lowering the age.
minimumReleaseAge: 1440 # minutes - no same-day publishes
# GHSA-vcvr-r3jv-pc5j: next 16.3.6 and its @next/* platform packages shipped 2026-09-22.
# Remove once they are older than minimumReleaseAge.
minimumReleaseAgeExclude:
  - next
  - "@next/env"
  - "@next/swc-darwin-arm64"
  - "@next/swc-darwin-x64"
  - "@next/swc-linux-arm64-gnu"
  - "@next/swc-linux-arm64-musl"
  - "@next/swc-linux-x64-gnu"
  - "@next/swc-linux-x64-musl"
  - "@next/swc-win32-arm64-msvc"
  - "@next/swc-win32-x64-msvc"
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: install

# Lifecycle-script allowlist. Replaces pnpm.onlyBuiltDependencies (removed in pnpm 11);
# a map, not a list.
allowBuilds:
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Every override records why it is here and what removes it. Keep the note on the entry.
overrides:
  # @types/react & @types/react-dom are managed by Next.js. Keep in lockstep with
  # the versions in package.json#devDependencies.
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  # preact 10.29.1 bump is to address CVE-2026-22028. Remove with better auth and next posthog-js bump
  preact: ^10.29.1
  # fast-xml-parser 5.7.0 bump is to address CVE-2026-25128, CVE-2026-27942, CVE-2026-33036, CVE-2026-33349 & CVE-2026-41650. Remove once we upgrade @azure/storage-blob
  fast-xml-parser: ^5.7.0
  # fast-xml-builder 1.1.7 to fix CVE-2026-44665. Remove with next @azure/storage-blob bump
  fast-xml-builder: ^1.1.7
  # lodash 4.18.0 bump is to address CVE-2025-13465, CVE-2026-2950 & CVE-2026-4800. Multiple peer dependenices hold outdated versions
  lodash: ^4.18.0
  # lodash-es 4.18.00 bump is to address CVE-2025-13465, CVE-2026-2950 & CVE-2026-4800. Fix with quill & react-quill-new bump
  lodash-es: ^4.18.0
  # minimatch 10.2.5 bump is to address CVE-2026-27904 & CVE-2026-13149). Remove with vitest 4x & eslint-config-next
  minimatch: ^10.2.5
  # immutable 5.1.8 bump is to address CVE-2026-29063, CVE-2026-59879, CVE-2026-59880. Multiple peer dependenices hold outdated versions.
  immutable: ^5.1.8
  # flatted 3.4.2 bump is to address CVE-2026-33228. Remove with next vitest bump
  flatted: ^3.4.2
  # picomatch 2.3.2 & 4.0.4 bump is to address CVE-2026-33671 & CVE-2026-33671. Multiple peer dependenices hold outdated versions.
  "picomatch@>=2 <3": ^2.3.2
  "picomatch@>=4 <5": ^4.0.4
  # yaml 2.8.3 bump is to address CVE-2026-33532 . Fix with vite bump
  yaml: ^2.8.3
  # vite 7.3.2 bump is to address GHSA-4w7w-66w2-5vf9, GHSA-v2wj-q39q-566r & CVE-2026-39363. Fix with vitest bump
  vite: ^7.3.5
  # fast-uri 3.1.2 bump to adress CVE-2026-6321 & CVE-2026-6322. Remove on next shadcn bump
  fast-uri: ^3.1.2
  # postcss Bump to 8.5.10 to address CVE-2026-41305. Remove with removal of next-auth if possible
  postcss: ^8.5.18
  # ip-address bump to 10.1.1 is to fix CVE-2026-42338. Remove on the next shadcn bump
  ip-address: ^10.1.1
  # protobufjs bump to 8.7.1 to address multiple otel related vulnerabilities. Remove on next otel bump
  protobufjs: ^8.7.1
  # @protobufjs/utf8 bump to 1.1.2 is to address multiple otel vulnerabilities. Remove on next otel bump
  "@protobufjs/utf8": ^1.1.2
  # @opentelemetry/sdk-node bump to 0.221.0 to address CVE-2026-59892. Remove with next @azure/monitor-opentelemetry bump
  "@opentelemetry/sdk-node": ^0.221.0
  # sharp bump to 0.35.3 is to address multiple CVEs. Bump with next next-js, next-auth and posthog bumps
  sharp: ^0.35.3
