name: "Setup Node & pnpm"
description: "Single source of the Hub pnpm/Node toolchain: installs pnpm, Node with a pnpm cache, and dependencies."

inputs:
  pnpm-version:
    description: "pnpm version to install. Keep in step with engines.pnpm and the Dockerfile."
    required: false
    default: "12.4.1"

runs:
  using: "composite"
  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: 📦 Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # .nvmrc is the single source of truth for the Node version - CI, the
        # Dockerfile major and package.json engines.node all follow it, and
        # __tests__/pnpm-toolchain.test.ts fails if they drift. Bump Node there.
        node-version-file: ".nvmrc"
        cache: "pnpm"

    # engines.pnpm is a range, not an exact pin (Corepack cannot run pnpm 12), and with a
    # range pnpm only *warns* about unrecognized pnpm-workspace.yaml keys. A typo in a
    # supply-chain setting would be silently ignored, so promote that warning to a failure.
    - name: 🥡 Install Dependencies
      shell: bash
      # `shell: bash` already implies `-eo pipefail`.
      run: |
        pnpm ci 2>&1 | tee "$RUNNER_TEMP/pnpm-install.log"
        ! grep -q "are not recognized by this version of pnpm" "$RUNNER_TEMP/pnpm-install.log"
