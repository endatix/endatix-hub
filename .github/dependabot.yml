version: 2
updates:
  - package-ecosystem: "npm"        # Dependabot reads pnpm-lock.yaml
    labels: ["dependencies"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 10
    # Must stay >= minimumReleaseAge in pnpm-workspace.yaml (1440 minutes), or
    # Dependabot proposes a version its own frozen install then refuses to resolve.
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for all open npm security fixes (version groups must not swallow these).
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # OpenTelemetry stays on the SDK 2.x / 0.2xx line with @opentelemetry/api 1.9
    # (package.json pins api ">=1.9.1 <1.10.0"). The 3.x / 0.3xx line, and
    # instrumentation-undici 0.34+, which needs core 3, require api 1.10, so a
    # weekly bump would undo the pin. Moving to 3.x is a deliberate change to the
    # api pin, every @opentelemetry/* range and these entries.
    ignore:
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/instrumentation-undici"
        versions: [">=0.34.0"]
      - dependency-name: "@opentelemetry/*"
        versions: [">=3.0.0", ">=0.300.0 <1.0.0"]

  - package-ecosystem: "github-actions"
    labels: ["dependencies"]
    # "/" covers .github/workflows; composite actions are not scanned unless listed.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Sofia"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    labels: ["dependencies"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Sofia"
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Dockerfile must stay on the Node LTS major declared in .nvmrc and
    # engines.node — an unattended major bump is how the image ended up on Node 26
    # while CI tested on 22. Patch/minor updates of the 22 tag still come through;
    # raising the major is a deliberate change to .nvmrc, engines.node and here.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
