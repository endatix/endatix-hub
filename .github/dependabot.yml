version: 2
updates:
  - package-ecosystem: "npm"        # Dependabot reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Must stay >= minimumReleaseAge in pnpm-workspace.yaml (1440 minutes), or
    # Dependabot proposes a version its own frozen install then refuses to resolve.
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions are not scanned unless listed.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # The Dockerfile must stay on the Node LTS major declared in .nvmrc and
    # engines.node — an unattended major bump is how the image ended up on Node 26
    # while CI tested on 22. Patch/minor updates of the 22 tag still come through;
    # raising the major is a deliberate change to .nvmrc, engines.node and here.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
