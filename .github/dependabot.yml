version: 2
updates:
  - package-ecosystem: "npm"        # Dependabot reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Must stay >= minimumReleaseAge in pnpm-workspace.yaml (1440 minutes), or
    # Dependabot proposes a version its own frozen install then refuses to resolve.
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
