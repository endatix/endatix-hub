name: Build, Test & Release

# Thin consumer of endatix/release-workflows (see its README):
#   • any PR (stacked ones included) → tests (below) + SonarCloud + build
#     validation in the shared pipeline
#     (scripts/release-prepare.sh @ 0.0.0-ci — builds the image and packages
#     the chart, publishes nothing)
#   • push main  → tests, then canary vX.Y.Z-canary.N: semantic-release builds
#     once at the real version and publishes the image + Helm chart to GHCR
#     (canaries NEVER go to Docker Hub — it is public and immutable).
#   • stable releases → MANUAL, human-reviewed: run "Start Stable Release"
#     (release-start.yml) → edit the draft notes → click "Publish release" →
#     release-artifacts.yml rebuilds at the tag and publishes to GHCR +
#     Docker Hub.
#
# The canary publishes ONLY after build + tests pass (needs: below).
# Repo-specific release logic lives in scripts/release-prepare.sh and
# scripts/release-publish.sh (the consumer contract), plus the dormant `stable`
# branch required by semantic-release's branch validation.

on:
  # Every PR, stacked ones included (base = another feature branch): they need
  # tests and the SonarCloud coverage too. The canary job only builds on PRs.
  pull_request:
  push:
    branches: [main, "hotfix/**"] # hotfix/X.Y.x pushes publish vX.Y.Z-hotfix.N builds
  workflow_dispatch:

# Serialize runs per ref so two quick merges to main can't run overlapping
# releases. Cancel in-flight runs only for pull requests to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Elevated permissions live on the pipeline job only — the test job is read-only.
permissions:
  contents: read

jobs:
  node-build:
    name: "Endatix Hub: Build & Test"
    runs-on: ubuntu-latest
    # Production + id-token: the SonarCloud token comes from Infisical over OIDC,
    # as in endatix-relay and the shared canary workflow (same identity).
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write # OIDC for Infisical, not repo write
    defaults:
      run:
        working-directory: "."

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for new-code and blame
          persist-credentials: false

      - name: 🧰 Setup Node & pnpm and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: 🗄️ Cache Next.js build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: 🧪 Run tests
        run: pnpm test:coverage

      - name: 🕵️‍♂️ Lint
        run: pnpm lint

      - name: 🏗️  Build Next.js app
        run: pnpm build

      - name: 🔌 Check storage env is read at runtime
        run: pnpm check:runtime-storage

      - name: 🔗 Check standalone runs with symlinks dereferenced
        run: pnpm check:dereferenced-standalone

      - name: 📊 Upload Coverage Report to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          format: cobertura
          file: .coverage/endatix-hub/cobertura-coverage.xml
          coverage-reporter-version: v0.6.22 # pinned: the Coveralls number depends on its parser

      - name: 📊 Endatix Hub Coverage
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: "Endatix Hub"
          json-summary-path: ".coverage/endatix-hub/coverage-summary.json"
          json-final-path: ".coverage/endatix-hub/coverage-final.json"

      # Fetched only now, after install, tests and build, so no dependency script or
      # build step sees the Infisical secrets. As in endatix-relay: `prod` on main,
      # `dev` everywhere else, so PR code never reaches release secrets.
      # Fork and Dependabot PRs get no OIDC secrets: they skip the scan, with a notice.
      - name: 🔐 Fetch secrets (Infisical, OIDC)
        id: infisical
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          env-slug: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          # Root folder only (no recursive): keeps folders such as the GitHub App
          # credentials out of this job.

      - name: ℹ️ No SonarCloud analysis on fork and Dependabot PRs
        if: steps.infisical.outcome == 'skipped'
        run: echo "::notice::SonarCloud analysis skipped - fork and Dependabot PRs get no Infisical secrets."

      - name: ❌ Require the SonarCloud token
        if: steps.infisical.outcome == 'success' && env.ENDATIX_HUB_REPO_SONAR_TOKEN == ''
        env:
          ENV_SLUG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          echo "::error::ENDATIX_HUB_REPO_SONAR_TOKEN is missing from the Infisical '$ENV_SLUG' environment (root folder)."
          exit 1

      # New code on main runs from the last stable release ("Previous version" in
      # SonarCloud). Without a version every analysis is "not provided" and the new-code
      # period never resets. Canary tags (v*-*) are skipped; fetch-depth 0 brings the tags.
      - name: 🏷️ SonarCloud project version (last stable tag)
        if: env.ENDATIX_HUB_REPO_SONAR_TOKEN != ''
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          echo "SONAR_PROJECT_VERSION=${tag#v}" >> "$GITHUB_ENV"

      # CI-based analysis with the Vitest lcov (sonar-project.properties). The scan
      # itself does not wait for the quality gate; the next step applies it.
      - name: 🔎 SonarCloud analysis
        if: env.ENDATIX_HUB_REPO_SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ env.ENDATIX_HUB_REPO_SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}

      # PRs: fails the job on red bugs, vulnerabilities, hotspots or coverage; duplication
      # only warns (endatix/endatix#1319). Pushes (main, hotfix): report only (`*`), since
      # the code is already merged and a red gate would only hold back the canary.
      # Same script as endatix/endatix.
      - name: 🚦 SonarCloud quality gate
        if: env.ENDATIX_HUB_REPO_SONAR_TOKEN != ''
        run: node scripts/sonar-gate.mjs
        env:
          SONAR_TOKEN: ${{ env.ENDATIX_HUB_REPO_SONAR_TOKEN }}
          SONAR_ADVISORY_METRICS: ${{ github.event_name == 'pull_request' && 'new_duplicated_lines_density' || '*' }}

  # Build validation on PRs; canary release on main — publishes only after the
  # tests above pass. docker-image makes the shared workflow log into GHCR and
  # export DOCKER_IMAGE to the release scripts; canaries stay on GHCR only.
  # Promoted releases mirror to Docker Hub — both stable AND maintenance (an
  # older line's hotfix still ships publicly); only stable moves the `latest`
  # tag, so a maintenance release never drags it backwards (release-publish.sh).
  # No secrets are passed: the shared workflow uses the implicit GITHUB_TOKEN
  # and fetches everything else via Infisical (OIDC, hence id-token).
  pipeline:
    name: Pipeline
    needs: [node-build]
    permissions:
      contents: read # release writes use the App token inside the shared workflow
      packages: write # GHCR image push + Helm chart push
      id-token: write # OIDC for Infisical inside the shared workflow
    uses: endatix/release-workflows/.github/workflows/canary.yml@12aed2d26cf9f506f6c0d55071aab721b28a6676 # v1
    with:
      docker-image: ghcr.io/endatix/endatix-hub
      # No dotnet-version/java-version: the image builds inside Docker and the
      # chart only needs the runner's preinstalled helm.
