apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endatix-hub.fullname" . }}
  labels:
    {{- include "endatix-hub.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "endatix-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "endatix-hub.selectorLabels" . | nindent 8 }}
    spec:
      # The Hub only talks to the Endatix API over HTTP — it never calls the
      # Kubernetes API, so a mounted service-account token would just park a
      # live credential in the pod for an attacker to find.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 1000 is the `node` user in the base image. The Dockerfile sets USER
        # node; this asserts it at admission rather than trusting the build.
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            # Node / Next.js
            - name: NODE_ENV
              value: {{ .Values.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}

            # Endatix API connection — exactly one of api.apiUrl or api.baseUrl
            {{- include "endatix-hub.apiEnvVars" . | nindent 12 }}

            # Survey extensions (data lists, custom questions). Request-time env, not image build.
            - name: ENDATIX_ENABLE_EXTENSIONS
              value: {{ .Values.experimental.extensions | quote }}

            # Public client config. Request-time, projected to the browser per request —
            # changing any of these is a `helm upgrade`, never an image rebuild.
            - name: ENDATIX_SURVEY_LICENSE_KEY
              value: {{ .Values.clientConfig.surveyLicenseKey | quote }}
            - name: ENDATIX_RECAPTCHA_SITE_KEY
              value: {{ .Values.clientConfig.recaptchaSiteKey | quote }}
            - name: ENDATIX_SUBMITTER_PRIMARY_FILTER_LABEL
              value: {{ .Values.clientConfig.submitterPrimaryFilterLabel | quote }}
            - name: ENDATIX_SUBMITTER_GRID_PROFILE_FIELDS
              value: {{ .Values.clientConfig.submitterGridProfileFields | quote }}
            - name: ENDATIX_IS_DEBUG_MODE
              value: {{ .Values.clientConfig.debugMode | quote }}

            # Product analytics — empty key disables PostHog.
            - name: ENDATIX_POSTHOG_KEY
              value: {{ .Values.analytics.posthogKey | quote }}
            - name: ENDATIX_POSTHOG_HOST
              value: {{ .Values.analytics.posthogHost | quote }}
            - name: ENDATIX_POSTHOG_UI_HOST
              value: {{ .Values.analytics.posthogUiHost | quote }}

            # Auth
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: session-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: auth-secret
            - name: AUTH_TRUST_HOST
              value: {{ .Values.auth.trustHost | quote }}
            - name: AUTH_URL
              value: {{ .Values.auth.url | quote }}

            # OpenTelemetry — empty endpoint disables export (same as otel.enabled=false)
            - name: OTEL_SERVICE_NAME
              value: {{ ternary .Values.otel.serviceName "" .Values.otel.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ ternary .Values.otel.endpoint "" .Values.otel.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ ternary .Values.otel.protocol "" .Values.otel.enabled | quote }}
            - name: NEXT_OTEL_VERBOSE
              value: {{ ternary "0" "" .Values.otel.enabled | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          # The only writable path, required by readOnlyRootFilesystem above.
          # Next.js and its dependencies spill to the OS temp dir at runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
