apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        # Node / Next.js
        - name: NODE_ENV
          value: {{ .Values.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.service.port | quote }}

        # Endatix API connection
        - name: ENDATIX_BASE_URL
          value: {{ .Values.api.baseUrl | quote }}
        - name: ENDATIX_API_URL
          value: {{ .Values.api.apiUrl | quote }}

        # Auth
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.secretName }}
              key: session-secret
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.secretName }}
              key: auth-secret
        - name: AUTH_TRUST_HOST
          value: {{ .Values.auth.trustHost | quote }}
        {{- if .Values.auth.url }}
        - name: AUTH_URL
          value: {{ .Values.auth.url | quote }}
        {{- end }}

        {{- if .Values.otel.enabled }}
        # OpenTelemetry
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.otel.serviceName | quote }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: {{ .Values.otel.protocol | quote }}
        - name: NEXT_OTEL_VERBOSE
          value: "0"
        {{- end }}

        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
