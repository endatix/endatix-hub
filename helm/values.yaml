replicaCount: 1

# ReplicaSets kept after a rollout for `kubectl rollout undo`. 0 because
# rollbacks go through Git (ArgoCD) or `helm rollback`, not the ReplicaSet
# history — stale ReplicaSets would only pile up as clutter in the namespace.
revisionHistoryLimit: 0

image:
  repository: endatix/endatix-hub
  pullPolicy: Always
  # tag defaults to chart appVersion

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

api:
  # Set exactly one of apiUrl or baseUrl (not both). Helm merges overlays onto
  # these defaults — set apiUrl: "" when overriding baseUrl.
  # Complete API URL including the /api suffix, e.g. http://endatix-api:8080/api
  apiUrl: "http://endatix-api:8080/api"
  # Origin without /api — used only when apiUrl is empty
  baseUrl: ""
  # Path prefix in baseUrl mode only. Hub defaults to /api if this is empty.
  apiPrefix: "/api"

# Public, request-time client config. Projected to the browser per request, so these can
# be changed with a `helm upgrade` — no image rebuild. Licence keys especially: replacing
# one must always be a config change.
clientConfig:
  # Optional. Name of an existing Secret to read the sensitive members of this block from,
  # instead of setting them literally below. When set, the chart reads the key
  # "survey-license-key" from it and ignores surveyLicenseKey.
  #
  # These values reach the browser either way — that is what "public client config" means —
  # so this is not about hiding them from users. It is about keeping them out of the git
  # repository that holds values.yaml, where they would sit in history, in every clone and
  # in `helm get values`. A SurveyJS licence has commercial value, so that distinction is
  # worth having even though the key itself is served to every visitor.
  secretName: ""
  # SurveyJS Creator licence key. Empty = unlicensed Creator (non-commercial banner).
  # Perpetual, so a running deployment keeps working; replace this when upgrading the
  # SurveyJS packages past the subscription window the current key covers.
  # Ignored when secretName is set.
  surveyLicenseKey: ""
  # Google reCAPTCHA site key. Empty disables reCAPTCHA.
  recaptchaSiteKey: ""
  # Override the "Submitter" column label and add submitter profile grid columns.
  submitterPrimaryFilterLabel: ""
  submitterGridProfileFields: ""
  # "false" hides "Powered by Endatix" on public status pages; empty keeps it shown.
  showPoweredBy: ""
  # Set to "true"/"false" to force debug mode; empty follows the build type.
  debugMode: ""

analytics:
  # Optional. As clientConfig.secretName — when set, the chart reads the key "posthog-key"
  # from this Secret and ignores posthogProjectToken below. The Secret key keeps its
  # original name so an existing Secret keeps working across this rename.
  secretName: ""
  # PostHog project token (phc_...). Empty disables product analytics and PostHog flags.
  # Ignored when secretName is set.
  posthogProjectToken: ""
  posthogHost: "https://us.i.posthog.com"
  posthogUiHost: ""
  # `posthog` to evaluate Hub flags via PostHog. Empty / `environment` uses FLAG_*.
  flagProvider: ""

experimental:
  # SurveyJS extensions (data-list questions, custom widgets). Defaults on so a
  # stock chart deploy registers and fetches data lists without a hidden switch.
  # This is a container env var (ENDATIX_ENABLE_EXTENSIONS), not a build-time flag.
  extensions: true

auth:
  # Name of an existing secret with keys: session-secret, auth-secret
  # session-secret: openssl rand -hex 32
  # auth-secret:    npx auth secret
  secretName: endatix-hub-auth-secret
  trustHost: "true"
  # Public URL of this hub, required for auth callbacks (e.g. https://hub.example.com)
  url: ""

nodeEnv: production

otel:
  enabled: false
  endpoint: ""
  protocol: grpc
  serviceName: endatix-hub

# Ephemeral storage covers the /tmp emptyDir (the root filesystem is read-only) and
# container logs. Past the limit the kubelet evicts the pod instead of filling the node.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 1Gi

nodeSelector: {}

# Extra environment variables as raw EnvVar objects; both `value` and
# `valueFrom` work. For Hub env vars the chart does not expose itself
# (storage, Slack, ...). Appended AFTER every variable the chart renders, so
# $(VAR) in these resolves names declared earlier in `env` (AUTH_URL and
# friends) plus anything extraEnvFrom supplies.
#
# Do not repeat a name the chart already sets; use its named value instead.
# Kubernetes keeps the last declaration, but duplicate names in `env` confuse
# patch-based upgrades (removing the override later can drop both entries).
#
# What this CANNOT do is change build-time config. Keys inlined into the image
# when it is built (NEXT_PUBLIC_*, nextConfig.env, basePath) are already fixed;
# the only exceptions are the deprecated NEXT_PUBLIC_* aliases the Hub still
# maps onto their ENDATIX_* names at startup.
extraEnv: []
#  - name: STORAGE_PROVIDER
#    value: "azure"
#  - name: STORAGE_AZURE_ACCOUNT_KEY
#    valueFrom:
#      secretKeyRef:
#        name: endatix-hub-server-secrets
#        key: storage-azure-account-key

# Extra envFrom sources — secretRef / configMapRef — for pulling in a whole
# Secret at once, which is the shape external-secret operators produce. Every
# key becomes an env var under its own name, so the Secret's keys must be the
# env var names (STORAGE_AZURE_ACCOUNT_KEY, not storage-azure-account-key).
# Mind the precedence: Kubernetes lets an explicit `env` entry win over
# anything envFrom supplies, even an empty one, so this can only ADD variables
# the chart does not set. A missing Secret or ConfigMap blocks new pods
# (CreateContainerConfigError) unless the source sets `optional: true`.
#
# Both knobs, like the chart's own secretKeyRefs, are read once at container
# start: a changed Secret does not reach running pods until they restart
# (kubectl rollout restart, or a reloader).
extraEnvFrom: []
#  - secretRef:
#      name: endatix-hub-server-secrets
