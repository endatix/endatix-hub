replicaCount: 1

image:
  repository: endatix/endatix-hub
  pullPolicy: Always
  # tag defaults to chart appVersion

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

api:
  # Set exactly one of apiUrl or baseUrl (not both). Helm merges overlays onto
  # these defaults — set apiUrl: "" when overriding baseUrl.
  # Complete API URL including the /api suffix, e.g. http://endatix-api:8080/api
  apiUrl: "http://endatix-api:8080/api"
  # Origin without /api — used only when apiUrl is empty
  baseUrl: ""
  # Path prefix in baseUrl mode only. Hub defaults to /api if this is empty.
  apiPrefix: "/api"

# Public, request-time client config. Projected to the browser per request, so these can
# be changed with a `helm upgrade` — no image rebuild. Licence keys especially: replacing
# one must always be a config change.
clientConfig:
  # SurveyJS Creator licence key. Empty = unlicensed Creator (non-commercial banner).
  # Perpetual, so a running deployment keeps working; replace this when upgrading the
  # SurveyJS packages past the subscription window the current key covers.
  surveyLicenseKey: ""
  # Google reCAPTCHA site key. Empty disables reCAPTCHA.
  recaptchaSiteKey: ""
  # Override the "Submitter" column label and add submitter profile grid columns.
  submitterPrimaryFilterLabel: ""
  submitterGridProfileFields: ""
  # Set to "true"/"false" to force debug mode; empty follows the build type.
  debugMode: ""

analytics:
  # PostHog. Empty key disables product analytics entirely.
  posthogKey: ""
  posthogHost: "https://us.i.posthog.com"
  posthogUiHost: ""

experimental:
  # SurveyJS extensions (data-list questions, custom widgets). Defaults on so a
  # stock chart deploy registers and fetches data lists without a hidden switch.
  # This is a container env var (ENDATIX_ENABLE_EXTENSIONS), not a build-time flag.
  extensions: true

auth:
  # Name of an existing secret with keys: session-secret, auth-secret
  # session-secret: openssl rand -hex 32
  # auth-secret:    npx auth secret
  secretName: endatix-hub-auth-secret
  trustHost: "true"
  # Public URL of this hub, required for auth callbacks (e.g. https://hub.example.com)
  url: ""

nodeEnv: production

otel:
  enabled: false
  endpoint: ""
  protocol: grpc
  serviceName: endatix-hub

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector: {}
