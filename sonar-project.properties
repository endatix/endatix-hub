# SonarCloud CI-based analysis (build-ci.yml). Automatic Analysis cannot import
# coverage, so it must be OFF in SonarCloud → Administration → Analysis Method.
sonar.projectKey=endatix_endatix-hub
sonar.organization=endatix
# No sonar.qualitygate.wait: SonarCloud Free cannot edit the "Sonar way" gate, so
# build-ci.yml runs scripts/sonar-gate.mjs after the scan. Duplication warns, every
# other red condition fails (endatix/endatix#1319).

# These settings replace the ones in SonarCloud → Administration, so this file must
# carry every exclusion the project had (*.tests.ts(x), e2e). Build output and
# dependencies are listed explicitly: the scan runs after `pnpm build`.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.tests.ts,**/*.tests.tsx,**/*.spec.ts,e2e/**,test/**
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.tests.ts,**/*.tests.tsx,**/*.spec.ts,e2e/**,test/**,.coverage/**,public/**,.next/**,node_modules/**

# Written by `pnpm test:coverage` in CI (vitest.config.mts).
sonar.javascript.lcov.reportPaths=.coverage/endatix-hub/lcov.info

# Mirror vitest.config.mts coverage include/exclude, so Sonar and Coveralls measure
# the same files. Keep the two in step.
sonar.coverage.exclusions=*.ts,*.mjs,*.js,**/*.js,**/*.mjs,**/*.cjs,**/*.d.ts,**/index.ts,**/server.ts,**/*.server.ts,**/client.ts,components/ui/**,features/**/*.tsx,extensions/**/*.tsx,types/**/*.tsx,src/**/*.tsx,customizations/**,examples/**,scripts/**,services/**,helm/**,assets/**
